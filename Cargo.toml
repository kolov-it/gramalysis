[package]
name = "syntango"
version = "0.1.0"
edition = "2024"
description = "Morphological and syntactic analysis of sentences, with explanations"
license = "Apache-2.0"
repository = "https://github.com/kolov-it/syntango"

[features]
default = ["cli"]
# Word Holder's lemmatize contract: its wire types and their conversion to
# readings, its lexicon patches, and the recorded-answer lexicon. No network.
wordholder = ["dep:serde_json"]
# The Word Holder API over HTTP (RapidAPI or the API's origin).
wordholder-http = ["wordholder", "dep:reqwest"]
# The `syntango` command-line tool.
cli = ["wordholder-http", "dep:tokio", "dep:clap"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[[bin]]
name = "syntango"
path = "src/bin/syntango/main.rs"
required-features = ["cli"]

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
